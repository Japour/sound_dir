[package]
name = "sound_dir"
version = "0.1.0"
edition = "2021"
description = "Directional sound visualizer for deaf gamers — see where sound comes from"
authors = ["Sound Dir Contributors"]
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/sound_dir"
homepage = "https://github.com/YOUR_USERNAME/sound_dir"
readme = "README.md"
keywords = ["audio", "accessibility", "gaming", "overlay", "visualizer"]
categories = ["multimedia::audio", "accessibility", "gui"]
build = "build.rs"

[dependencies]
cpal = "0.15"
anyhow = "1"
realfft = "3"
eframe = { version = "0.27", default-features = false, features = ["wgpu", "default_fonts"] }
display-info = "0.5"
tray-icon = "0.13"
global-hotkey = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
ico = "0.3"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
